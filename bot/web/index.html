<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4Seas Bot — Commands</title>
<style>
  :root {
    --bg:#f7f7f5; --panel:#fff; --line:#e3e3df; --text:#1c1c1a; --dim:#6b6b66;
    --accent:#2f6f4f; --accent-soft:#e7f1ea; --danger:#a8322a; --danger-soft:#fbeae8;
    --warn:#8a6100; --warn-soft:#fdf3dd; --radius:10px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16171a; --panel:#1f2126; --line:#32353c; --text:#e8e8e4; --dim:#9a9a94;
           --accent:#6bbf90; --accent-soft:#20302a; --danger:#e08b82; --danger-soft:#33211f;
           --warn:#e0b45c; --warn-soft:#332a18; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);
         background:var(--panel);color:var(--text);cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger);border-color:var(--danger)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px 16px;margin-bottom:10px}
  .row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .grow{flex:1;min-width:220px}
  .name{font-family:var(--mono);font-size:15px;font-weight:600}
  .desc{color:var(--dim);font-size:13px;margin-top:2px}
  .reply{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;
         background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:10px;
         max-height:150px;overflow:auto}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tag.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .tag.off{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13.5px;display:none}
  .msg.show{display:block}
  .msg.err{background:var(--danger-soft);color:var(--danger)}
  .msg.ok{background:var(--accent-soft);color:var(--accent)}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--text);
         padding:0;width:min(620px,94vw)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  form{padding:20px}
  label{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 5px;font-weight:600;
        text-transform:uppercase;letter-spacing:.04em}
  label:first-of-type{margin-top:0}
  input[type=text],textarea,select{width:100%;padding:8px 10px;border-radius:8px;
       border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  textarea{font-family:var(--mono);font-size:13px;min-height:130px;resize:vertical}
  .hint{font-size:12px;color:var(--dim);margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0}
  .checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
  .check{display:flex;align-items:center;gap:7px;font-size:13.5px}
  .check input{width:auto;margin:0}
  .cols{display:flex;gap:14px;flex-wrap:wrap}
  .cols>div{flex:1;min-width:150px}
  .dlg-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;
            border-top:1px solid var(--line);padding-top:16px}
  .status{font-size:12.5px;color:var(--dim);font-family:var(--mono);
          background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
          padding:12px 14px;white-space:pre-wrap;margin-top:26px}
  .empty{color:var(--dim);text-align:center;padding:44px 0;font-size:14px}
  .lang{font-size:12.5px;padding:4px 10px;color:var(--dim)}
  .tabs{display:flex;gap:4px;margin:4px 0 16px;border-bottom:1px solid var(--line)}
  .tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;
       padding:8px 14px;color:var(--dim)}
  .tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);
       font-weight:600;margin:22px 0 8px}
  .fld{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
       padding:12px 14px;margin-bottom:8px}
  .fld .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .fld label{margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}
  .fld .help{font-size:12.5px;color:var(--dim);margin:4px 0 8px}
  .fld input,.fld select{margin-top:2px}
  .pill{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--warn-soft);
        color:var(--warn);font-weight:600;white-space:nowrap}
  .chk{font-size:12.5px;margin-top:6px;min-height:1.2em}
  .chk.bad{color:var(--danger)} .chk.good{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>4Seas Bot</h1>
    <span class="sub" id="hSub"></span>
    <span style="margin-left:auto"><button class="lang" id="langToggle"></button></span>
  </header>
  <div class="sub" id="hTag"></div>

  <div class="bar">
    <button class="primary" id="add"></button>
    <button id="sendDigest"></button>
    <button id="reloadAll"></button>
    <button id="refresh"></button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="tabs">
    <button class="tab on" data-tab="commands" id="tabC"></button>
    <button class="tab" data-tab="settings" id="tabS"></button>
  </div>

  <div id="pane-commands">
    <div id="list"></div>
  </div>

  <div id="pane-settings" hidden>
    <div id="settings"></div>
    <div class="bar">
      <button class="primary" id="saveSettings"></button>
      <span class="sub" id="tzNote"></span>
    </div>
  </div>
  <div class="status" id="status">loading…</div>
</div>

<dialog id="dlg"><form id="form" method="dialog">
  <h2 id="dlgTitle" style="margin:0 0 4px;font-size:17px">New command</h2>
  <div class="sub" id="dlgSub"></div>

  <label data-i18n="fCommand"></label>
  <input type="text" id="f_command" autocomplete="off" spellcheck="false" placeholder="wifi">
  <div class="hint" data-i18n-html="hintCommand"></div>

  <label data-i18n="fDesc"></label>
  <input type="text" id="f_description" autocomplete="off" placeholder="Venue Wi-Fi details">
  <div class="hint" data-i18n-html="hintDesc"></div>

  <label data-i18n="fReply"></label>
  <textarea id="f_reply" spellcheck="false" placeholder="📶 &lt;b&gt;Wi-Fi&lt;/b&gt;&#10;Network: &lt;code&gt;4Seas-Guest&lt;/code&gt;"></textarea>
  <div class="hint" data-i18n-html="hintReply"></div>

  <div class="cols">
    <div>
      <label data-i18n="fScope"></label>
      <select id="f_scope">
        <option value="all" data-i18n="scopeAll"></option>
        <option value="group" data-i18n="scopeGroup"></option>
        <option value="private" data-i18n="scopePrivate"></option>
      </select>
    </div>
    <div>
      <label data-i18n="fParse"></label>
      <select id="f_parse_mode">
        <option>HTML</option><option>Markdown</option>
        <option>MarkdownV2</option><option value="none" data-i18n="parsePlain"></option>
      </select>
    </div>
  </div>

  <div class="checks">
    <label class="check"><input type="checkbox" id="f_enabled" checked> <span data-i18n="enabled"></span></label>
    <label class="check"><input type="checkbox" id="f_admin_only"> <span data-i18n="adminOnly"></span></label>
    <label class="check"><input type="checkbox" id="f_disable_preview" checked> <span data-i18n="noPreview"></span></label>
  </div>

  <div class="msg err" id="dlgMsg"></div>

  <div class="dlg-foot">
    <button type="button" id="cancel" data-i18n="cancel"></button>
    <button type="button" class="primary" id="save" data-i18n="ok"></button>
  </div>
</form></dialog>

<script>
const token = new URLSearchParams(location.search).get('token') || sessionStorage.getItem('t') || '';
if (token) sessionStorage.setItem('t', token);

// ── i18n ─────────────────────────────────────────────────────────────
// 中文是默认：日常用这个页面的是社区运营，不是写代码的人。
const STR = {
  zh: {
    subtitle: '机器人管理', tagline: '改动立即生效，不用重启，也不用发 /reload。',
    tabCommands: '自定义命令', tabSettings: '配置',
    add: '+ 新建命令', sendDigest: '立即发送预告', reloadAll: '重载 FAQ 与关键词',
    refresh: '刷新', save: '保存配置',
    dlgNew: '新建命令', dlgEdit: '编辑 /', fCommand: '命令', fDesc: '说明', fReply: '回复内容',
    fScope: '生效范围', fParse: '解析模式', enabled: '已启用', disabled: '已停用',
    adminOnly: '仅管理员', noPreview: '不显示链接预览',
    scopeAll: '任何地方', scopeGroup: '仅群聊', scopePrivate: '仅私聊', parsePlain: '纯文本',
    cancel: '取消', ok: '保存', edit: '编辑', disable: '停用', enable: '启用', del: '删除',
    empty: '还没有自定义命令，点上面新建一个。',
    hintCommand: '小写字母、数字、下划线。会变成 /wifi 这样的命令。',
    hintDesc: '显示在 /help 和 Telegram 的命令菜单里。',
    hintReply: 'HTML：<b> <i> <u> <s> <code> <pre> <a href="">。字面的 &lt; &gt; &amp; 必须转义，否则 Telegram 整条拒收。',
    sharesFile: (f, n) => `保存会重写 ${f}，那里还有另外 ${n} 条命令，文件里的注释会丢失。`,
    confirmDel: n => `删除 /${n}？会从配置文件里移除。`,
    confirmSend: (c, s) => `现在把预告发到群 ${c}？\n\n覆盖范围：${s}\n发出去就撤不回来了。`,
    confirmSave: (c, t) => `保存配置？\n\n预告将在 ${t} 发到群 ${c || '（未设置）'}。\n立即生效。`,
    saved: '配置已保存', sentTo: (c, d) => `已发送到 ${c} — ${d}`,
    reloaded: 'FAQ、关键词和命令已重载', checking: '检查中…',
    tz: t => `时间按 ${t} 时区`,
    changedHere: '在此改过', reschedules: '会重排定时任务',
    stEvents: '活动', stLive: '在架', stTotal: '总计', stLastSync: '上次导入',
    stNever: '从未', stSyncAt: '导入时间', stDigest: '播报', stFaq: 'FAQ 条目',
    stKeywords: '关键词规则', stCommands: '自定义命令', stMuted: '静默群', stDaily: '每天',
  },
  en: {
    subtitle: 'command management', tagline: 'Changes take effect immediately — no restart, no /reload.',
    tabCommands: 'Commands', tabSettings: 'Settings',
    add: '+ New command', sendDigest: 'Send digest now', reloadAll: 'Reload FAQ & keywords',
    refresh: 'Refresh', save: 'Save settings',
    dlgNew: 'New command', dlgEdit: 'Edit /', fCommand: 'Command', fDesc: 'Description', fReply: 'Reply',
    fScope: 'Scope', fParse: 'Parse mode', enabled: 'enabled', disabled: 'disabled',
    adminOnly: 'admins only', noPreview: 'No link preview',
    scopeAll: 'Anywhere', scopeGroup: 'Groups only', scopePrivate: 'Private chat only', parsePlain: 'Plain text',
    cancel: 'Cancel', ok: 'Save', edit: 'Edit', disable: 'Disable', enable: 'Enable', del: 'Delete',
    empty: 'No custom commands yet. Create one above.',
    hintCommand: 'Lowercase letters, digits and underscore. Becomes /wifi.',
    hintDesc: "Shown in /help and Telegram's command menu.",
    hintReply: 'HTML: <b> <i> <u> <s> <code> <pre> <a href="">. Literal &lt; &gt; &amp; must be escaped.',
    sharesFile: (f, n) => `Saving rewrites ${f}, which holds ${n} other command(s). Comments there will be lost.`,
    confirmDel: n => `Delete /${n}? This removes it from the config file.`,
    confirmSend: (c, s) => `Send the digest to chat ${c} right now?\n\nCovers: ${s}\nThis posts immediately and cannot be undone.`,
    confirmSave: (c, t) => `Save settings?\n\nThe digest will go to chat ${c || '(none)'} at ${t}.\nThis takes effect immediately.`,
    saved: 'Settings saved', sentTo: (c, d) => `Sent to ${c} — ${d}`,
    reloaded: 'FAQ, keyword rules and commands reloaded', checking: 'checking…',
    tz: t => `times are ${t}`,
    changedHere: 'changed here', reschedules: 'reschedules jobs',
    stEvents: 'events', stLive: 'live', stTotal: 'total', stLastSync: 'last sync',
    stNever: 'never', stSyncAt: 'sync at', stDigest: 'digest', stFaq: 'faq',
    stKeywords: 'keywords', stCommands: 'commands', stMuted: 'muted', stDaily: 'daily',
  },
};
let lang = localStorage.getItem('lang') || 'zh';
const t = k => STR[lang][k];

const $ = id => document.getElementById(id);
let editing = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {'Content-Type': 'application/json', 'X-Admin-Token': token, ...(opts.headers || {})},
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || (res.status === 401
    ? 'Unauthorised — open this page using the ?token=… link from the bot log.'
    : `Request failed (${res.status})`));
  return body;
}

function flash(text, kind = 'ok') {
  const m = $('msg');
  m.textContent = text;
  m.className = `msg show ${kind}`;
  if (kind === 'ok') setTimeout(() => m.className = 'msg', 4000);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(data) {
  const list = $('list');
  const problems = [...(data.file_errors || []), ...(data.config_errors || [])];
  if (problems.length) flash(problems.join(' · '), 'warn');

  if (!data.commands.length) {
    list.innerHTML = `<div class="empty">${t('empty')}</div>`;
    return;
  }

  list.innerHTML = data.commands.map(c => `
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="name">/${esc(c.command)}</div>
          ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
          <div class="tags">
            <span class="tag ${c.enabled ? 'on' : 'off'}">${c.enabled ? t('enabled') : t('disabled')}</span>
            ${c.admin_only ? `<span class="tag">${t('adminOnly')}</span>` : ''}
            ${c.scope !== 'all' ? `<span class="tag">${esc(c.scope)}</span>` : ''}
            <span class="tag">${esc(c.source_file)}</span>
          </div>
        </div>
        <div class="actions">
          <button data-act="edit" data-n="${esc(c.command)}">${t('edit')}</button>
          <button data-act="toggle" data-n="${esc(c.command)}">${c.enabled ? t('disable') : t('enable')}</button>
          <button class="danger" data-act="del" data-n="${esc(c.command)}">${t('del')}</button>
        </div>
      </div>
      <div class="reply">${esc(c.reply)}</div>
    </div>`).join('');

  list.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => act(b.dataset.act, b.dataset.n, data.commands);
  });
}

async function act(kind, name, all) {
  const cmd = all.find(c => c.command === name);
  try {
    if (kind === 'edit') return open(cmd);
    if (kind === 'toggle') {
      await api(`/api/commands/${name}/toggle`, {method:'POST', body: JSON.stringify({enabled: !cmd.enabled})});
      flash(`/${name} ${cmd.enabled ? 'disabled' : 'enabled'}`);
    }
    if (kind === 'del') {
      if (!confirm(t('confirmDel')(name))) return;
      await api(`/api/commands/${name}`, {method:'DELETE'});
      flash(`/${name} deleted`);
    }
    await load();
  } catch (e) { flash(e.message, 'err'); }
}

function open(cmd) {
  editing = cmd ? cmd.command : null;
  $('dlgTitle').textContent = cmd ? t('dlgEdit') + cmd.command : t('dlgNew');
  $('dlgSub').textContent = cmd && cmd.siblings ? t('sharesFile')(cmd.source_file, cmd.siblings) : '';
  $('f_command').value = cmd?.command || '';
  $('f_description').value = cmd?.description || '';
  $('f_reply').value = cmd?.reply || '';
  $('f_scope').value = cmd?.scope || 'all';
  $('f_parse_mode').value = cmd?.parse_mode || 'HTML';
  $('f_enabled').checked = cmd ? cmd.enabled : true;
  $('f_admin_only').checked = cmd?.admin_only || false;
  $('f_disable_preview').checked = cmd ? cmd.disable_preview : true;
  $('dlgMsg').className = 'msg err';
  $('dlg').showModal();
  $('f_command').focus();
}

$('save').onclick = async () => {
  const payload = {
    command: $('f_command').value.trim(),
    description: $('f_description').value.trim(),
    reply: $('f_reply').value,
    scope: $('f_scope').value,
    parse_mode: $('f_parse_mode').value,
    enabled: $('f_enabled').checked,
    admin_only: $('f_admin_only').checked,
    disable_preview: $('f_disable_preview').checked,
  };
  try {
    if (editing) await api(`/api/commands/${editing}`, {method:'PUT', body: JSON.stringify(payload)});
    else await api('/api/commands', {method:'POST', body: JSON.stringify(payload)});
    $('dlg').close();
    flash(`/${payload.command} saved and live`);
    await load();
  } catch (e) {
    const m = $('dlgMsg'); m.textContent = e.message; m.className = 'msg err show';
  }
};

// Check the markup as soon as the author leaves the box, not after Save —
// an unclosed tag makes Telegram reject the whole message at send time.
$('f_reply').onblur = async () => {
  const m = $('dlgMsg');
  if ($('f_parse_mode').value !== 'HTML') { m.className = 'msg err'; return; }
  try {
    const r = await api('/api/check-html', {method:'POST', body: JSON.stringify({
      reply: $('f_reply').value, parse_mode: $('f_parse_mode').value,
    })});
    if (r.problem) { m.textContent = `HTML: ${r.problem}`; m.className = 'msg err show'; }
    else { m.className = 'msg err'; }
  } catch (_) { /* validation is a convenience; saving still enforces it */ }
};

$('cancel').onclick = () => $('dlg').close();
$('add').onclick = () => open(null);
$('refresh').onclick = () => load();
$('sendDigest').onclick = async () => {
  // Name the destination in the prompt. This posts to DAILY_REPORT_CHAT_ID, not
  // to whatever you were last looking at — confirming blind is how a test message
  // ends up in the 776-member group.
  const s = await api('/api/status').catch(() => null);
  const target = s ? s.report.chat_id : 'the configured chat';
  const scope = s ? s.report.scope : '';
  if (!confirm(t('confirmSend')(target, scope))) return;
  try {
    const r = await api('/api/send-digest', {method:'POST'});
    flash(t('sentTo')(r.chat_id, r.detail));
    await load();
  } catch (e) { flash(e.message, 'err'); }
};

$('reloadAll').onclick = async () => {
  try { await api('/api/reload', {method:'POST'}); flash(t('reloaded')); await load(); }
  catch (e) { flash(e.message, 'err'); }
};

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('langToggle').textContent = lang === 'zh' ? 'EN' : '中文';
  $('hSub').textContent = t('subtitle');
  $('hTag').textContent = t('tagline');
  $('tabC').textContent = t('tabCommands');
  $('tabS').textContent = t('tabSettings');
  $('add').textContent = t('add');
  $('sendDigest').textContent = t('sendDigest');
  $('reloadAll').textContent = t('reloadAll');
  $('refresh').textContent = t('refresh');
  $('saveSettings').textContent = t('save');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
}

$('langToggle').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', lang);
  applyLang(); load();
  if (!$('pane-settings').hidden) loadSettings();
};

// ── settings ──────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('pane-commands').hidden = t.dataset.tab !== 'commands';
  $('pane-settings').hidden = t.dataset.tab !== 'settings';
  if (t.dataset.tab === 'settings') loadSettings();
});

function fieldInput(f) {
  const id = `s_${f.key}`;
  const v = f.value === null || f.value === undefined ? '' : f.value;
  if (f.kind === 'bool')
    return `<label class="check"><input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}> enabled</label>`;
  if (f.kind === 'choice')
    return `<select id="${id}">${f.choices.map(c =>
      `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  return `<input type="text" id="${id}" value="${esc(v)}" autocomplete="off" spellcheck="false">`;
}

async function loadSettings() {
  const d = await api('/api/settings');
  $('tzNote').textContent = t('tz')(d.timezone);
  const L = f => lang === 'zh' ? f.label_zh : f.label;
  const H = f => lang === 'zh' ? f.help_zh : f.help;
  const groups = [...new Set(d.fields.map(f => f.group))];
  $('settings').innerHTML = groups.map(g => {
    const gz = (d.fields.find(f => f.group === g) || {}).group_zh || g;
    return `
    <div class="grp">${esc(lang === 'zh' ? gz : g)}</div>
    ${d.fields.filter(f => f.group === g).map(f => `
      <div class="fld">
        <div class="top">
          <label for="s_${f.key}">${esc(L(f))}</label>
          <span>${f.overridden ? `<span class="pill">${t('changedHere')}</span>` : ''}
                ${f.reschedules ? `<span class="pill">${t('reschedules')}</span>` : ''}</span>
        </div>
        <div class="help">${esc(H(f))}</div>
        ${fieldInput(f)}
        ${f.key === 'daily_report_chat_id' ? '<div class="chk" id="chatCheck"></div>' : ''}
      </div>`).join('')}`;
  }).join('');

  // Verify the target chat as soon as it is typed — the bot must already be a
  // member, and finding that out at 19:00 from a log line is far too late.
  const chat = $('s_daily_report_chat_id');
  if (chat) chat.onblur = async () => {
    const box = $('chatCheck');
    if (!chat.value.trim()) { box.textContent = ''; return; }
    box.textContent = t('checking'); box.className = 'chk';
    try {
      const r = await api('/api/check-chat', {method:'POST', body: JSON.stringify({chat_id: chat.value})});
      if (r.problem) { box.textContent = `✗ ${r.problem}`; box.className = 'chk bad'; }
      else { box.textContent = `✓ ${r.ok || 'reachable'}`; box.className = 'chk good'; }
    } catch (e) { box.textContent = e.message; box.className = 'chk bad'; }
  };
  window._fields = d.fields;
}

$('saveSettings').onclick = async () => {
  const payload = {};
  for (const f of (window._fields || [])) {
    const el = $(`s_${f.key}`);
    if (!el) continue;
    payload[f.key] = f.kind === 'bool' ? el.checked : el.value;
  }
  const target = payload.daily_report_chat_id;
  if (!confirm(t('confirmSave')(target, payload.daily_report_time))) return;
  try {
    const r = await api('/api/settings', {method:'PUT', body: JSON.stringify(payload)});
    flash([t('saved'), ...(r.notes || [])].join(' · '), (r.notes || []).some(n => n.includes('⚠️')) ? 'warn' : 'ok');
    await loadSettings(); await load();
  } catch (e) { flash(e.message, 'err'); }
};

async function load() {
  try {
    render(await api('/api/commands'));
    const s = await api('/api/status');
    const ls = s.last_sync;
    const pad = k => (t(k) + '            ').slice(0, lang === 'zh' ? 9 : 12);
    $('status').textContent = [
      `${pad('stEvents')}${s.events.live} ${t('stLive')} / ${s.events.total} ${t('stTotal')}`,
      `${pad('stLastSync')}${ls ? `${ls.ok ? 'ok' : 'FAILED'}  ${ls.at.slice(0,16).replace('T',' ')} UTC  ` +
        `+${ls.inserted} ~${ls.updated} =${ls.unchanged}` : t('stNever')}`,
      `${pad('stSyncAt')}${s.sync_times}`,
      `${pad('stDigest')}${s.report.time} → ${s.report.chat_id} (${s.report.scope})`,
      `${pad('stFaq')}${s.faq_entries}`,
      `${pad('stKeywords')}${s.keyword_rules}`,
      `${pad('stCommands')}${s.custom_commands}`,
      s.muted_chats.length ? `${pad('stMuted')}${s.muted_chats.join(', ')}` : null,
    ].filter(Boolean).join('\n');
  } catch (e) { flash(e.message, 'err'); }
}

applyLang();
load();
</script>
</body>
</html>
