# Keyword auto-reply rules
#
# match     Terms to match. ASCII terms match on word boundaries (so "visa" won't
#           fire on "visable"); non-ASCII terms match as plain substrings.
#           Keep BOTH English and Chinese/Thai terms — people ask in any language,
#           but the bot always replies in English.
# cooldown  Seconds before this rule can fire again in the same chat. Required:
#           in a 776-member group, no cooldown means guaranteed spam.
# reply     Telegram HTML: <b>bold</b> <i>italic</i> <a href="">link</a> <code>code</code>
#
# Send /reload in the group after editing — no restart needed.
# One message fires at most one rule (the first match), they don't stack.

# ⚠️ visa / housing / wifi are commented out — their text is still a placeholder
#    and must not go out to 776 people. Fill in the real answer, uncomment,
#    then /reload.

- id: events
  match: ["what events", "any events", "what's on", "whats on", "有什么活动", "最近活动", "今天有啥"]
  cooldown: 1800
  reply: |
    📅 Send /events to see what's coming up,
    or check the <a href="https://app.sola.day/event/4seas">4Seas calendar on Social Layer</a>.

- id: join
  match: ["how to join", "how do i join", "how can i join", "怎么加入", "如何加入"]
  cooldown: 3600
  reply: |
    🙌 Welcome! All community events live on <a href="https://app.sola.day/event/4seas">Social Layer</a>.
    Just pick one that looks interesting and show up — no gatekeeping.
    For anything specific, @ an admin here.

