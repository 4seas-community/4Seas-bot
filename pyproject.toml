[project]
name = "4seas-bot"
version = "0.1.0"
description = "4Seas community Telegram bot — daily events, Q&A, interactions, keyword triggers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

dependencies = [
    "python-telegram-bot[job-queue]>=22.8",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "openai>=1.60",
    "icalendar>=6.1",
    "aiohttp>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "respx>=0.22"]

[project.scripts]
4seas-bot = "bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.hatch.build.targets.wheel.force-include]
"bot/web/index.html" = "bot/web/index.html"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
